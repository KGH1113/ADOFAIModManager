name: Repair 0.2.4 draft signature
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v0.2.4
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.2.4
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Validate and download the existing draft
        run: |
          set -euo pipefail
          bun scripts/prepare-update-release.mjs "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --dir downloaded
      - name: Bind the Linux signature to the release version
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(downloaded/*.AppImage)
          test "${#appimages[@]}" -eq 1
          bun run tauri signer sign --app-version "${RELEASE_TAG#v}" "${appimages[0]}"
          bun scripts/prepare-update-release.mjs "$RELEASE_TAG" downloaded corrected-assets docs/releases/0.2.4.md
      - name: Replace only the draft signature and update manifest
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" corrected-assets/*.AppImage.sig corrected-assets/latest.json --clobber
          gh release edit "$RELEASE_TAG" --notes-file docs/releases/0.2.4.md
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets > uploaded-release.json
          bun scripts/verify-update-release.mjs corrected-assets/latest.json uploaded-release.json
