name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bun scripts/prepare-update-release.mjs "$env:RELEASE_TAG"
        if: runner.os == 'Windows'
      - name: Validate release versions
        if: runner.os != 'Windows'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bun scripts/prepare-update-release.mjs "$RELEASE_TAG"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf clang zlib1g-dev libfuse2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:release
      - run: bun run check:engine
      - run: bun run prepare:desktop
        env:
          AMM_TARGET: ${{ matrix.target }}
      - run: bun run check:desktop
      - name: Build signed update artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
      - name: Remove bundled libwayland-client from AppImage
        # The bundled copy breaks EGL on newer Wayland systems (EGL_BAD_PARAMETER).
        # Wayland sessions always provide the system library.
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          ARCH: x86_64
        run: |
          set -euo pipefail
          dir="src-tauri/target/${{ matrix.target }}/release/bundle/appimage"
          app="$(cd "$dir" && ls -- *.AppImage)"
          tool="$RUNNER_TEMP/appimagetool"
          wget -q -O "$tool" https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x "$tool"
          work="$RUNNER_TEMP/appimage-repack"
          rm -rf "$work" && mkdir -p "$work"
          (cd "$work" && "$GITHUB_WORKSPACE/$dir/$app" --appimage-extract >/dev/null)
          removed="$(find "$work/squashfs-root" -name 'libwayland-client.so*' -print -delete)"
          if [ -z "$removed" ]; then echo "::error::libwayland-client not found in AppImage"; exit 1; fi
          echo "Removed: $removed"
          rm -f "$dir/$app" "$dir/$app.sig"
          "$tool" "$work/squashfs-root" "$dir/$app"
          bun run tauri signer sign "$dir/$app"
          test -s "$dir/$app.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/download-artifact@v4
        with:
          pattern: update-*
          path: release-builds
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$RELEASE_TAG" --jq .body > release-notes.md
          fi
      - name: Assemble complete update manifest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bun scripts/prepare-update-release.mjs "$RELEASE_TAG" release-builds release-assets release-notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
      - name: Verify uploaded update URLs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets > uploaded-release.json
          bun scripts/verify-update-release.mjs release-assets/latest.json uploaded-release.json
