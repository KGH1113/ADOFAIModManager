[package]
name = "adofai-mod-manager"
version = "0.2.1"
description = "ADOFAI Mod Manager desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "adofai_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "fs", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# macOS 27's strip can misalign host proc-macro dylibs (rust-lang/rust#157750).
# Keep build dependencies unstripped; the shipped application still uses strip above.
[profile.release.build-override]
strip = false
